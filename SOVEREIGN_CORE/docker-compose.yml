services:
  core:
    build: ./core
    environment:
      KCD_MODEL_ENDPOINT: http://llama:8080
      KCD_MODEL_NAME: qwen3-1.7b-base
      KCD_MODEL_FILE: /models/qwen3-1.7b-base-q4_k_m.gguf
      KCD_MODEL_SHA256: ${KCD_MODEL_SHA256:-}
      KCD_ALLOWED_MODEL_HOSTS: llama
    volumes:
      - /opt/kcdee/models/Qwen3-1.7B-Base-Runtime:/models:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - llama
    networks:
      - sovereign

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - -m
      - /models/qwen3-1.7b-base-q4_k_m.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -c
      - "4096"
      - -n
      - "1024"
    volumes:
      - /opt/kcdee/models/Qwen3-1.7B-Base-Runtime:/models:ro
    expose:
      - "8080"
    networks:
      - sovereign

networks:
  sovereign:
    internal: true
